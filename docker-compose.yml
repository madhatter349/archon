# Archon Docker Compose — Coolify deployment
#
# Differences from upstream (dev stack), all required for a public host:
#   * no host port publishing (Coolify/Traefik routes the frontend; the host
#     already owns 8000/8180/5432) — services are reachable over `expose`
#   * restart policy + named volume for postgres
#   * secrets interpolated from Coolify env (see Coolify app env)
#   * keycloak dropped: it needs realm/bootstrap config to be useful and the
#     backend runs with ARCHON_AUTH_DEV_MODE=true; re-add if SSO is wanted
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: archon
      POSTGRES_PASSWORD: ${ARCHON_POSTGRES_PASSWORD}
      POSTGRES_DB: archon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archon"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # yamllint disable-line rule:line-length
      ARCHON_DATABASE_URL: "postgresql+asyncpg://archon:${ARCHON_POSTGRES_PASSWORD}@postgres:5432/archon"
      ARCHON_REDIS_URL: "redis://redis:6379/0"
      ARCHON_AUTH_DEV_MODE: "true"
      ARCHON_JWT_SECRET: ${ARCHON_JWT_SECRET}
      ARCHON_JWT_ALGORITHM: "HS256"
      ARCHON_DEBUG: "false"
      ARCHON_LOG_LEVEL: "INFO"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
